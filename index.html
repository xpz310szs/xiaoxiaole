<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="google" content="notranslate" />
  <title>星钻小游戏</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="hub.css" />
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
  </div>

  <main class="hub">
    <header class="hero">
      <p class="eyebrow">STAR GAMES</p>
      <h1>星钻小游戏</h1>
      <p class="tagline">选一款，马上开玩</p>
    </header>

    <nav class="game-list" aria-label="游戏列表">
      <a class="game-card match3" href="match3/">
        <div class="preview" aria-hidden="true">
          <span class="gem g1"></span>
          <span class="gem g2"></span>
          <span class="gem g3"></span>
          <span class="gem g4"></span>
        </div>
        <div class="meta">
          <h2>星钻消消</h2>
          <p>滑动三连消除 · 连击得分</p>
        </div>
        <span class="go">开始</span>
      </a>

      <a class="game-card tetris" href="tetris/">
        <div class="preview blocks" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="meta">
          <h2>星钻方块</h2>
          <p>经典下落方块 · 消行升级</p>
        </div>
        <span class="go">开始</span>
      </a>

      <a class="game-card zen" href="zen/">
        <div class="preview bubbles" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="meta">
          <h2>星钻解压</h2>
          <p>戳泡泡 · 捏捏球 · 开关墙</p>
        </div>
        <span class="go">开始</span>
      </a>

      <a class="game-card calm" href="calm/">
        <div class="preview calm-orb" aria-hidden="true">
          <span class="orb"></span>
        </div>
        <div class="meta">
          <h2>星钻静心</h2>
          <p>呼吸 · 星空 · 涟漪放松</p>
        </div>
        <span class="go">开始</span>
      </a>
    </nav>
  </main>
</body>
</html>
