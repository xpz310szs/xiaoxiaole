<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="google" content="notranslate" />
  <title>星钻小游戏</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="hub.css" />
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
  </div>

  <main class="hub" id="hub">
    <header class="hero">
      <p class="eyebrow">STAR GAMES</p>
      <h1>星钻小游戏</h1>
      <p class="tagline">选一款，马上开玩</p>
    </header>

    <nav class="game-list" aria-label="游戏列表">
      <a class="game-card match3" href="match3.html">
        <div class="preview" aria-hidden="true">
          <span class="gem g1"></span>
          <span class="gem g2"></span>
          <span class="gem g3"></span>
          <span class="gem g4"></span>
        </div>
        <div class="meta">
          <h2>星钻消消</h2>
          <p>滑动三连消除 · 连击得分</p>
        </div>
        <span class="go">开始</span>
      </a>

      <a class="game-card tetris" href="tetris.html">
        <div class="preview blocks" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="meta">
          <h2>星钻方块</h2>
          <p>经典下落方块 · 消行升级</p>
        </div>
        <span class="go">开始</span>
      </a>

      <a class="game-card zen" href="zen.html">
        <div class="preview bubbles" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="meta">
          <h2>星钻解压</h2>
          <p>戳泡泡 · 捏捏球 · 开关墙</p>
        </div>
        <span class="go">开始</span>
      </a>

      <a class="game-card calm" href="calm.html">
        <div class="preview calm-orb" aria-hidden="true">
          <span class="orb"></span>
        </div>
        <div class="meta">
          <h2>星钻静心</h2>
          <p>呼吸 · 星空 · 涟漪放松</p>
        </div>
        <span class="go">开始</span>
      </a>

      <a class="game-card maze" href="maze.html">
        <div class="preview maze-mini" aria-hidden="true">
          <span></span><span></span><span></span>
          <span></span><span class="dot"></span><span></span>
          <span></span><span></span><span></span>
        </div>
        <div class="meta">
          <h2>星钻迷宫</h2>
          <p>滑动找路 · 难度可选</p>
        </div>
        <span class="go">开始</span>
      </a>

      <a class="game-card parkour" href="parkour.html">
        <div class="preview run-mini" aria-hidden="true">
          <span class="runner"></span>
          <span class="hurdle"></span>
        </div>
        <div class="meta">
          <h2>星钻跑酷</h2>
          <p>二段跳 · 躲障碍 · 捡星星</p>
        </div>
        <span class="go">开始</span>
      </a>

      <a class="game-card cook" href="cook.html">
        <div class="preview cook-mini" aria-hidden="true">
          <span class="pan"></span>
          <span class="food"></span>
        </div>
        <div class="meta">
          <h2>星钻厨房</h2>
          <p>按顺序做菜 · 赶上上菜</p>
        </div>
        <span class="go">开始</span>
      </a>

      <a class="game-card dress" href="dress.html">
        <div class="preview outfit" aria-hidden="true">
          <span class="hair"></span>
          <span class="face"></span>
          <span class="fit"></span>
        </div>
        <div class="meta">
          <h2>星钻换装</h2>
          <p>发型 · 衣服 · 配饰随便搭</p>
        </div>
        <span class="go">开始</span>
      </a>

      <a class="game-card battle" href="battle.html">
        <div class="preview battle-mini" aria-hidden="true">
          <span class="hero-dot"></span>
          <span class="slash"></span>
          <span class="mob-dot"></span>
        </div>
        <div class="meta">
          <h2>星钻打怪</h2>
          <p>开枪跳跃 · 击败波次怪物</p>
        </div>
        <span class="go">开始</span>
      </a>
    </nav>
  </main>
</body>
</html>
