<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="google" content="notranslate" />
  <title>星钻换装</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg" id="scene-bg" aria-hidden="true">
    <div class="spark s1"></div>
    <div class="spark s2"></div>
    <div class="spark s3"></div>
  </div>
  <main class="stage">
    <header class="top-bar">
      <a class="back-link" href="../" target="_parent">← 大厅</a>
      <div class="logo-block">
        <p class="logo-en">STYLE STUDIO</p>
        <h1 class="logo">星钻换装</h1>
      </div>
      <button type="button" class="icon-btn" id="random" aria-label="随机搭配" title="随机搭配">✦</button>
    </header>
    <section class="runway" aria-label="角色展示">
      <div class="stage-frame" id="stage-frame">
        <div class="character" id="character" aria-hidden="true"></div>
        <div class="floor-glow"></div>
      </div>
      <p class="tip" id="tip">点下方服装，马上换上</p>
    </section>
    <section class="studio" aria-label="换装面板">
      <div class="cats" role="tablist" aria-label="服装分类" id="cats"></div>
      <div class="tray" id="tray" role="tabpanel" aria-label="可选单品"></div>
      <div class="actions">
        <button type="button" class="action ghost" id="reset">还原</button>
        <button type="button" class="action solid" id="pose">摆姿势</button>
      </div>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
